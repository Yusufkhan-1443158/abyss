# ==============================================
# Tile rendering proxy cache
# ==============================================
# On-demand rendered tiles are cached to disk.
# Max 50GB, evicted after 90 days of no access.

proxy_cache_path /var/cache/nginx/tiles
    levels=1:2
    keys_zone=tile_cache:64m
    max_size=50g
    inactive=90d
    use_temp_path=off;
