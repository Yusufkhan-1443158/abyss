# =============================================
# Abyss by Orbion — DEV nginx (HTTP only)
# Static apps + API reverse proxy + OSM basemap proxy.
# =============================================

server {
    listen 80;
    server_name abyss.local localhost _;

    root /var/www/apps;
    client_max_body_size 20G;

    # Issue relative Location headers so redirects preserve the browser's
    # host:port (we sit behind a published port map, e.g. 9088->80; an absolute
    # redirect would drop the port and bounce to http://localhost/).
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bare domain → login (with DEV_NO_AUTH the login page auto-forwards home).
    location = / {
        return 302 /login.html;
    }

    # Shared static assets
    location /libs/    { alias /var/www/libs/; }
    location /css/     { alias /var/www/css/; }
    location = /fonts.css { alias /var/www/fonts.css; }
    location /fonts/ {
        alias /var/www/fonts/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location = /favicon.svg { alias /var/www/apps/favicon.svg; }

    # OSM raster basemap (dev): online proxy with an empty-tile fallback so the
    # map always has context. Airgapped installs replace this with local tiles.
    location /raster-tiles/ {
        try_files $uri @tile_online;
        add_header Access-Control-Allow-Origin *;
        expires 30d;
    }
    location @tile_online {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        if ($request_uri ~* "^/raster-tiles/(.+)$") { set $tile_path $1; }
        proxy_pass https://tile.openstreetmap.org/$tile_path;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "Abyss-Dev/1.0";
        proxy_ssl_server_name on;
        proxy_intercept_errors on;
        error_page 502 503 504 =204 /empty_tile;
        proxy_cache tile_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Tile-Source "online-proxy" always;
        add_header Access-Control-Allow-Origin * always;
    }
    location = /empty_tile { internal; return 204; }

    # Bathymetry SSE / long inference (no buffering) — must precede /api/.
    location /api/bathymetry/ {
        proxy_pass http://fastapi:8000/api/bathymetry/;
        proxy_set_header Host $http_host;   # include :port so FastAPI 307 (trailing-slash) redirects keep it
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # FastAPI
    location /api/ {
        proxy_pass http://fastapi:8000/api/;
        proxy_set_header Host $http_host;   # include :port so FastAPI 307 (trailing-slash) redirects keep it
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
    }

    # Static app files
    location / {
        try_files $uri $uri/ =404;
    }
}
