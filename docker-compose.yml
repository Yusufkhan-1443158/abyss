# Abyss by Orbion — distilled bathymetry stack (OPERATIONAL baseline).
#
# This file is hardened by default: auth enforced (DEV_NO_AUTH=false), file-based
# Docker secrets (no plaintext credentials), TLS at nginx, Redis-backed rate
# limiting, and SSE-S3 object encryption. config.py resolves every credential as
# "direct env var → /run/secrets/* file → safe default", so removing the plaintext
# env here makes it read the mounted secret.
#
# Operational bring-up:
#   bash secure-config/keys/GENERATE.sh          # secret files (incl. seed creds)
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout secure-config/certs/abyss.key -out secure-config/certs/abyss.crt \
#     -subj "/CN=abyss.local"                     # self-signed demo cert
#   docker compose up --build                     # app at https://localhost:9443
#
# Zero-friction local dev (no secrets/TLS/login) — add the dev overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Internal service hostnames keep the globe-* names config.py defaults to
# (PG_HOST=globe-postgres, REDIS_HOST=globe-redis, MINIO_ENDPOINT=globe-minio).
# User-facing container names are abyss-*.

networks:
  abyss-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  redis-data:
  vmarch-cache:      # vmarch-core S2/coastline caches (scene pinning)
  vmarch-downloads:  # vmarch-core MLE GeoTIFF artifacts (/downloads)
  raster-cache:   # shared /tmp/raster_cache so the COG built at ingest (worker)
                  # is instantly visible to the tile renderer (fastapi).

# ---- Docker secrets (file-based) -------------------------------------------
# Generated by secure-config/keys/GENERATE.sh. The secret names map to the
# /run/secrets/* paths config.py + the postgres/minio/redis images read.
secrets:
  jwt_secret:
    file: ./secure-config/keys/jwt-secret.txt
  postgres_password:
    file: ./secure-config/keys/postgres-password.txt
  minio_password:
    file: ./secure-config/keys/minio-password.txt
  minio_kms_key:
    file: ./secure-config/keys/minio-kms-key.txt
  redis_password:
    file: ./secure-config/keys/redis-password.txt
  seed_admin_password:
    file: ./secure-config/keys/seed-admin-password.txt
  seed_analyst_password:
    file: ./secure-config/keys/seed-analyst-password.txt
  seed_viewer_password:
    file: ./secure-config/keys/seed-viewer-password.txt
  # Anthropic API key for the /api/chat assistant. Operator-supplied (paste your
  # key into this file); GENERATE.sh only touches an empty placeholder. Empty ⇒
  # the assistant replies "not configured" instead of erroring.
  anthropic_api_key:
    file: ./secure-config/keys/anthropic-api-key.txt

services:

  # ---- PostgreSQL 15 + PostGIS 3.3 -------------------------------------------
  globe-postgres:
    image: postgis/postgis:15-3.3
    container_name: abyss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: gis
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [abyss-net]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Redis 7 (Celery broker / blacklist / rate-limit / cache) --------------
  # Password-protected operationally (config.py builds redis://:<pw>@… for the
  # blacklist /3, rate-limit /4, and Celery /1,/2 from the same secret).
  globe-redis:
    image: redis:7-alpine
    container_name: abyss-redis
    restart: unless-stopped
    command: sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)" --save 60 1 --loglevel warning'
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks: [abyss-net]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Dedicated tile hot-layer Redis (SW_TILE_CACHE L2) ---------------------
  # Bounded + allkeys-lru; kept separate from the broker so tile churn never
  # evicts broker/blacklist keys. Stays UNAUTHENTICATED (internal-only, avoids
  # tile-cache churn) — tile_cache.py refuses the shared instance.
  sw-redis:
    image: redis:7-alpine
    container_name: abyss-sw-redis
    restart: unless-stopped
    command: redis-server --maxmemory 1536mb --maxmemory-policy allkeys-lru --save "" --loglevel warning
    networks: [abyss-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- MinIO (S3-compatible object storage) ----------------------------------
  globe-minio:
    image: minio/minio:latest
    container_name: abyss-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
      # Built-in single-key KMS so buckets can use SSE-S3 (set by ensure_buckets()).
      # Format: <key-name>:<base64-32-byte-key> (GENERATE.sh emits this file).
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio_kms_key
    secrets:
      - minio_password
      - minio_kms_key
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks: [abyss-net]
    # No host port publish — internal only (host 9000/9001 are used by another
    # local stack). Access via the abyss-net network (globe-minio:9000).
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---- One-shot DB migration runner ------------------------------------------
  migrate:
    image: postgis/postgis:15-3.3
    container_name: abyss-migrate
    entrypoint: ["bash", "/migrations/run_migrations.sh", "globe-postgres", "5432", "gis", "postgres"]
    secrets:
      - postgres_password
    volumes:
      - ./migrations:/migrations:ro
    networks: [abyss-net]
    depends_on:
      globe-postgres:
        condition: service_healthy
    restart: "no"

  # ---- FastAPI backend -------------------------------------------------------
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    image: abyss-fastapi:latest
    container_name: abyss-fastapi
    restart: unless-stopped
    environment: &backend-env
      PG_HOST: globe-postgres
      PG_PORT: "5432"
      PG_DATABASE: gis
      PG_USER: postgres
      # PG_PASSWORD unset → config.py reads /run/secrets/postgres_password
      MINIO_ENDPOINT: globe-minio:9000
      MINIO_ACCESS_KEY: admin
      # MINIO_SECRET_KEY unset → config.py reads /run/secrets/minio_password
      MINIO_SECURE: "false"
      REDIS_HOST: globe-redis
      REDIS_PORT: "6379"
      # CELERY_BROKER_URL / CELERY_RESULT_BACKEND unset → config.py builds them
      # with the Redis password (redis://:<pw>@globe-redis:6379/1,2).
      # JWT_SECRET unset → config.py reads /run/secrets/jwt_secret (fail-fast if weak)
      DEV_NO_AUTH: "false"
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
      CORS_ORIGINS: https://localhost:9443
      RATE_LIMIT_DEFAULT: "120/minute"
      RATE_LIMIT_LOGIN: "5/minute"
      SEED_FORCE: "true"
      # Tile hot layer (instant-load): read-through L1+L2 cache on a dedicated redis.
      SW_TILE_CACHE: "1"
      SW_REDIS_URL: redis://sw-redis:6379/0
      # Bathymetry inference service (proxied by routers/bathymetry.py).
      BATHYMETRY_SERVICE_URL: http://bathymetry:8002
      GDAL_CACHEMAX: "1024"
      GDAL_NUM_THREADS: "4"
    secrets:
      - jwt_secret
      - postgres_password
      - minio_password
      - redis_password
      - seed_admin_password
      - seed_analyst_password
      - seed_viewer_password
      - anthropic_api_key
    volumes:
      - raster-cache:/tmp/raster_cache
    networks: [abyss-net]
    ports: ["8000:8000"]
    depends_on:
      globe-postgres:
        condition: service_healthy
      globe-redis:
        condition: service_healthy
      globe-minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 20

  # ---- Celery worker (instant-load ingest + bathymetry pipeline) -------------
  celery-worker:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    image: abyss-fastapi:latest
    container_name: abyss-celery-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=50 -Q celery,sw_bg
    environment: *backend-env
    secrets:
      - postgres_password
      - minio_password
      - redis_password
    volumes:
      - raster-cache:/tmp/raster_cache
    networks: [abyss-net]
    depends_on:
      globe-redis:
        condition: service_healthy
      globe-postgres:
        condition: service_healthy
      globe-minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ---- Celery beat (scheduled maintenance) -----------------------------------
  celery-beat:
    image: abyss-fastapi:latest
    container_name: abyss-celery-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    environment: *backend-env
    secrets:
      - postgres_password
      - redis_password
    networks: [abyss-net]
    depends_on:
      - celery-worker

  # ---- Bathymetry inference service (stub model; real model swaps /infer) -----
  # The service reads MINIO_SECRET_KEY from env only, so the entrypoint exports it
  # from the mounted secret (operational) or falls back to minioadmin (dev).
  bathymetry:
    build:
      context: ./bathymetry-service
      dockerfile: Dockerfile
    image: abyss-bathymetry:latest
    container_name: abyss-bathymetry
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: globe-minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECURE: "false"
      # Real VMarch platform service — the vmarch-core-* engines call it.
      VMARCH_CORE_URL: http://vmarch-core:8080
    entrypoint:
      - sh
      - -c
      - 'MINIO_SECRET_KEY="$$(cat /run/secrets/minio_password 2>/dev/null)"; [ -n "$$MINIO_SECRET_KEY" ] || MINIO_SECRET_KEY=minioadmin; export MINIO_SECRET_KEY; exec uvicorn main:app --host 0.0.0.0 --port 8002'
    secrets:
      - minio_password
    networks: [abyss-net]
    ports: ["8002:8002"]
    depends_on:
      globe-minio:
        condition: service_healthy

  # ---- VMarch core (the user's actual Bathymetry_VMarch platform) ------------
  # Built from the full platform checked in at ./BathymetryVJuly — its own
  # Dockerfile, gunicorn backend.app:app on :8080. The bathymetry service
  # delegates the "vmarch-core-*" studio method cards to its REAL endpoints
  # (/api/sdb-pro, /api/very-hr-clustered, /api/very-hr-mle) so the products
  # are computed by the platform code itself, not a port. Internal only — no
  # published ports. Imagery credentials come from a gitignored env file
  # (variable list documented in Bathymetry_ADport.md).
  vmarch-core:
    build:
      context: ./BathymetryVJuly
      dockerfile: Dockerfile
    image: abyss-vmarch-core:latest
    container_name: abyss-vmarch-core
    restart: unless-stopped
    # Platform Dockerfile CMD uses --timeout 600 (Railway proxy window) and
    # --preload. Here: timeout raised for the multi-scene MLE run, and
    # --preload dropped — the app starts a warm-up thread at import, and
    # forking workers while that thread holds the import lock deadlocks the
    # child on its next import (observed: worker wedged in ee.Initialize).
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "2",
              "--timeout", "3600", "backend.app:app"]
    env_file:
      - path: ./secure-config/vmarch-core.env
        required: false
    volumes:
      # Imagery/result caches survive restarts: scene choice stays pinned per
      # (bbox, dates) and MLE artifacts under /downloads stay resolvable.
      - vmarch-cache:/app/cache
      - vmarch-downloads:/app/backend/ocean/downloads
    networks: [abyss-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/api/health',timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  # ---- nginx (TLS · static apps + API reverse proxy + OSM basemap) -----------
  nginx:
    image: nginx:alpine
    container_name: abyss-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./secure-config/certs:/etc/nginx/certs:ro
      - ./apps:/var/www/apps:ro
      - ./libs:/var/www/libs:ro
      - ./css:/var/www/css:ro
      - ./fonts:/var/www/fonts:ro
      - ./fonts.css:/var/www/fonts.css:ro
    networks: [abyss-net]
    ports:
      - "9088:80"     # 301 → https
      - "9443:443"    # app (TLS)
    depends_on:
      fastapi:
        condition: service_healthy
