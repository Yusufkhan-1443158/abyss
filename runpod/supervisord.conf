; Abyss single-container process manager. Long-running services only — one-time
; setup (secret generation, postgres init, DB migrations) runs in entrypoint.sh
; BEFORE supervisord starts. Dependent app processes wait for their backing
; services via small guards so we avoid crash-loops during boot ordering.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

[program:postgres]
command=/bin/bash -c "exec $(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)/postgres -D /var/lib/postgresql/data"
user=postgres
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis-globe]
command=redis-server /etc/redis/globe.conf
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis-sw]
command=redis-server --port 6380 --maxmemory 1536mb --maxmemory-policy allkeys-lru --save "" --loglevel warning
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=minio server /data --address :9000 --console-address :9001
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bathymetry]
directory=/app/bathymetry-service
command=/bin/bash -c "until curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; do sleep 1; done; exec /opt/venv-bathy/bin/uvicorn main:app --host 0.0.0.0 --port 8002"
priority=20
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vmarch-core]
; The real Bathymetry_VMarch platform (vmarch-core-* method cards). Imagery
; credentials (SH_CLIENT_ID/SECRET, GEE service account, MAPBOX_TOKEN,
; EARTHDATA_*, GEMINI_API_KEY — full list in Bathymetry_ADport.md) come from
; the pod's environment.
directory=/app/vmarch-core
; no --preload: the app's import-time warm-up thread + fork deadlocks workers
command=/opt/venv-vmarch/bin/gunicorn --bind 0.0.0.0:8080 --workers 2 --timeout 3600 backend.app:app
priority=20
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fastapi]
directory=/app/fastapi
command=/bin/bash -c "until pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; do sleep 1; done; exec /opt/venv-api/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips=*"
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-worker]
directory=/app/fastapi
command=/bin/bash -c "until pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; do sleep 1; done; exec /opt/venv-api/bin/celery -A app.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=50 -Q celery,sw_bg"
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-beat]
directory=/app/fastapi
command=/bin/bash -c "until pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; do sleep 2; done; exec /opt/venv-api/bin/celery -A app.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule"
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=40
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
