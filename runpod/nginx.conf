# Abyss single-container nginx (RunPod). HTTP-only on :80 — TLS is terminated by
# RunPod's edge proxy, which forwards plain HTTP here and sets X-Forwarded-Proto.
# All upstreams are on localhost (everything runs in this one container).
# App-layer hardening (enforced JWT login, rate limiting, MinIO SSE) is unchanged.

# On-demand rendered/basemap tile cache (disk).
proxy_cache_path /var/cache/nginx/tiles
    levels=1:2 keys_zone=tile_cache:64m max_size=20g inactive=90d use_temp_path=off;

# Honour RunPod's X-Forwarded-Proto (https at the edge); fall back to $scheme
# for direct/local access so trailing-slash redirects keep the right scheme.
map $http_x_forwarded_proto $abyss_fwd_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/apps;
    client_max_body_size 20G;
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / { return 302 /login.html; }

    location /libs/    { alias /var/www/libs/; }
    location /css/     { alias /var/www/css/; }
    location = /fonts.css { alias /var/www/fonts.css; }
    location /fonts/ {
        alias /var/www/fonts/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location = /favicon.svg { alias /var/www/apps/favicon.svg; }

    # OSM raster basemap: online proxy with an empty-tile fallback.
    location /raster-tiles/ {
        try_files $uri @tile_online;
        add_header Access-Control-Allow-Origin *;
        expires 30d;
    }
    location @tile_online {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        if ($request_uri ~* "^/raster-tiles/(.+)$") { set $tile_path $1; }
        proxy_pass https://tile.openstreetmap.org/$tile_path;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "Abyss/1.0";
        proxy_ssl_server_name on;
        proxy_intercept_errors on;
        error_page 502 503 504 =204 /empty_tile;
        proxy_cache tile_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Tile-Source "online-proxy" always;
        add_header Access-Control-Allow-Origin * always;
    }
    location = /empty_tile { internal; return 204; }

    # Bathymetry SSE / long inference (no buffering) — must precede /api/.
    location /api/bathymetry/ {
        proxy_pass http://127.0.0.1:8000/api/bathymetry/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $abyss_fwd_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $abyss_fwd_proto;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
    }

    # App pages are updated in place — force browsers to revalidate every
    # load (expires -1 => Cache-Control: no-cache; ETag still enables 304s).
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
